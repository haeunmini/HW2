name: Deploy Docker image to local Windows runner

on:
  workflow_run:
    workflows: ["Build and publish Docker image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-waste-classifier-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The runner must be the registered Windows machine with Docker Desktop.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows]
    timeout-minutes: 45
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/waste-classifier:${{ github.event.workflow_run.head_sha || github.sha }}
      CONTAINER_NAME: waste-classifier
    steps:
      - name: Check out monitoring script
        uses: actions/checkout@v4

      - name: Prepare fixed verification image
        shell: powershell
        run: |
          $bytes = [Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=')
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'fixed-test.png'), $bytes)
          New-Item -ItemType File -Force -Path (Join-Path $env:RUNNER_TEMP 'monitor.jsonl') | Out-Null

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the newly published image
        shell: powershell
        run: |
          (Get-Date).ToUniversalTime().ToString('o') | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'deploy-start.txt')
          docker pull $env:IMAGE

      - name: Start independent pre-deployment monitor
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'monitor.jsonl'
          $stop = Join-Path $env:RUNNER_TEMP 'monitor-complete.txt'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/monitor.ps1'
          Remove-Item $stop -Force -ErrorAction SilentlyContinue
          $p = Start-Process powershell -ArgumentList "-NoProfile -File `"$script`" -ImagePath `"$env:RUNNER_TEMP/fixed-test.png`" -LogPath `"$log`" -StopFile `"$stop`"" -PassThru
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'monitor.pid') -Value $p.Id
          (Get-Date).ToUniversalTime().ToString('o') | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'monitor-start.txt')
          Start-Sleep -Seconds 3
          try { Invoke-RestMethod http://127.0.0.1:8000/api/health | ConvertTo-Json -Compress } catch { Write-Host 'No pre-deployment service response.' }

      - name: Replace the local container
        shell: powershell
        run: |
          $existing = docker ps -aq --filter "name=^$env:CONTAINER_NAME$"
          if ($existing) {
            docker stop $env:CONTAINER_NAME
            docker rm $env:CONTAINER_NAME
          }
          docker run --detach --name $env:CONTAINER_NAME --restart unless-stopped --publish 8000:8000 $env:IMAGE

      - name: Verify application health
        shell: powershell
        run: |
          $uri = 'http://127.0.0.1:8000/api/health'
          $deadline = (Get-Date).AddMinutes(3)
          do {
            try {
              $response = Invoke-RestMethod -Uri $uri -TimeoutSec 10
              $response | ConvertTo-Json -Compress
              if ($response.ok -and $response.model_loaded -and -not $response.model_error) {
                (Get-Date).ToUniversalTime().ToString('o') | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'deploy-end.txt')
                exit 0
              }
            } catch {
              Write-Host "Health check not ready: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          Write-Host 'Container logs:'
          docker logs $env:CONTAINER_NAME
          throw 'The application did not report a loaded model at /api/health.'

      - name: Keep monitoring for 30 seconds after deployment
        if: always()
        shell: powershell
        run: |
          Start-Sleep -Seconds 30
          (Get-Date).ToUniversalTime().ToString('o') | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'monitor-complete.txt')

      - name: Publish monitoring summary and logs
        if: always()
        shell: powershell
        run: '& "$env:GITHUB_WORKSPACE/scripts/publish-summary.ps1"'

      - name: Upload monitoring logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-monitor-log
          path: deployment-monitor.jsonl
          if-no-files-found: warn
