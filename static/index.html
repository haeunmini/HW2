<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>분리배출 분류기</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>♻️ 분리배출 분류기</h1><p class="sub">사진을 올리면 재질을 추정하고 배출 요령을 안내합니다.</p><section class="card upload-card"><div id="dropzone" class="dropzone" tabindex="0"><input id="file" type="file" accept="image/*" hidden><div class="upload-icon">↑</div><h2>쓰레기 사진을 올려주세요</h2><p>이미지를 끌어 놓거나 아래 버튼으로 선택하세요</p><button type="button" id="choose" class="choose-button">사진 선택</button><small>JPG, PNG, WEBP · 최대 10MB</small></div><div id="file-info" class="file-info" hidden><span class="file-badge">IMG</span><div><strong id="filename"></strong><span id="filesize" class="muted"></span></div><button type="button" id="remove" class="icon-button" aria-label="사진 삭제">×</button></div><img id="preview" alt="선택한 이미지 미리보기"><button id="analyze" disabled>분석하기</button><p id="error" class="error"></p></section><section id="result" class="card result" hidden><h2 id="category"></h2><p>확률 <strong id="probability"></strong></p><p id="method" class="muted"></p><h3>배출 요령</h3><ul id="tips"></ul><div class="notice" id="notice"></div></section></main><script src="/static/app.js"></script></body></html>
